<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuix Neo Pricing Tool</title>
  <link rel="stylesheet" href="style.css">
  <style>
    #gate-overlay {
      position: fixed; inset: 0; z-index: 99999;
      background: #0f172a;
      display: flex; align-items: center; justify-content: center;
    }
    #gate-overlay.hidden { display: none; }
    .gate-card {
      background: #1e293b; border: 1px solid #334155;
      border-radius: 16px; padding: 48px 40px;
      width: 100%; max-width: 360px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.5);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    .gate-org { font-size: 11px; font-weight: 700; letter-spacing: 2px; color: #64748b; text-transform: uppercase; margin-bottom: 8px; }
    .gate-title { font-size: 24px; font-weight: 700; color: #f1f5f9; margin-bottom: 32px; }
    .gate-label { display: block; font-size: 13px; font-weight: 600; color: #94a3b8; margin-bottom: 8px; }
    .gate-input {
      width: 100%; padding: 12px 16px; background: #0f172a;
      border: 1px solid #334155; border-radius: 8px;
      color: #f1f5f9; font-size: 15px; outline: none;
      box-sizing: border-box; margin-bottom: 20px;
      transition: border-color 0.15s;
    }
    .gate-input:focus { border-color: #0056e3; }
    .gate-btn {
      width: 100%; padding: 13px; background: #0056e3;
      color: white; border: none; border-radius: 8px;
      font-size: 15px; font-weight: 600; cursor: pointer;
      transition: background 0.15s;
    }
    .gate-btn:hover { background: #1a7a9e; }
    .gate-error { color: #f87171; font-size: 13px; margin-bottom: 16px; display: none; }
    #version-tag {
      position: fixed; right: 10px; bottom: 8px; z-index: 9998;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 11px; color: #9ca3af; opacity: 0.7;
      pointer-events: none; user-select: none;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="version-tag">v1.7.0</div>
  <script src="pricing.config.js"></script>
  <script src="legacy_skus.js"></script>
  <script src="app.js"></script>
</body>
</html>
